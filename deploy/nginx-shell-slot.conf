location = /api/shell-slot {
  try_files /api/shell-slot.php =404;
  include fastcgi_params;
  fastcgi_pass unix:/run/php/php-fpm.sock;
  fastcgi_param SCRIPT_FILENAME $document_root/api/shell-slot.php;
  fastcgi_param SCRIPT_NAME /api/shell-slot.php;
  fastcgi_param HTTP_COOKIE $http_cookie;
  client_max_body_size 16k;
}
