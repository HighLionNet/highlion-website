# Include ONLY inside the Cloudflare Tunnel origin server, whose listen
# directives must bind to 127.0.0.1 / [::1], not 0.0.0.0 / [::].
# The cloudflared server owns real_ip_header and real_ip_recursive.
# cloudflared provides these headers; direct public sockets are never trusted.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
