root /var/www/highlion;
index index.html;
recursive_error_pages on;

include /var/www/highlion/deploy/nginx-headers.conf;
include /var/www/highlion/deploy/nginx-path-server.conf;
include /var/www/highlion/deploy/nginx-api.conf;
include /var/www/highlion/deploy/nginx-abuse.conf;
# An explicit server log preserves the regular access log as well as the
# conditional highlion-path log declared by the path include.
access_log /var/log/nginx/access.log cloudflare;

location = / {
    expires -1;
    try_files /index.html =404;
}
location / {
    try_files $uri $uri.html =404;
}
location = /robots.txt {
    access_log off;
    log_not_found off;
}
location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files /assets/icons/HighLion.ico =404;
}
location = /assets/writeups/pdf/CVE-2026-2441.pdf {
    expires -1;
    try_files $uri =404;
}
location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|mp4|pdf|pkt)$ {
    try_files $uri =404;
    expires 7d;
    # No add_header here: it would suppress inherited security headers.
}
location = /contact.html {
    ssi on;
    ssi_silent_errors on;
    expires -1;
    try_files $uri =404;
}
location ~ \.html$ {
    expires -1;
    try_files $uri =404;
}

error_page 403 /403.html;
error_page 404 /404.html;
error_page 405 /405.html;
location = /403.html {
    internal;
    recursive_error_pages off;
    auth_request off;
    expires off;
    add_header Cache-Control "no-store" always;
    include /var/www/highlion/deploy/nginx-headers.conf;
}
location = /404.html {
    internal;
    recursive_error_pages off;
    auth_request off;
    expires off;
    add_header Cache-Control "no-store" always;
    include /var/www/highlion/deploy/nginx-headers.conf;
}
location = /405.html {
    internal;
    recursive_error_pages off;
    auth_request off;
    expires off;
    add_header Cache-Control "no-store" always;
    include /var/www/highlion/deploy/nginx-headers.conf;
}
