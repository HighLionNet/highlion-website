# Install as /etc/logrotate.d/highlion-path. Do not duplicate a pre-existing
# rule for the shared PHP log. Stock Debian nginx logrotate covers *.log;
# the nginx stanza below is ONLY needed if your /etc/logrotate.d/nginx does not.
# /var/log/nginx/highlion-path.log {
#     daily
#     maxsize 10M
#     rotate 7
#     missingok
#     notifempty
#     compress
#     delaycompress
#     create 0640 www-data adm
#     sharedscripts
#     postrotate
#         /usr/sbin/nginx -s reopen
#     endscript
# }
/var/tmp/highlion-honeypot.log {
    daily
    maxsize 5M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0600 www-data www-data
    su www-data www-data
}
