autoindex off;
location = /js/shell/image/resolv.conf { try_files $uri =404; }
location ~ (?:^|/)\. { return 404; }
location ~* (?:^|/)(?:(?:deploy|tests)(?:/|$)|README(?:-OWNER)?\.(?:md|txt)$|OWNER\.txt$) { return 404; }
location ~* \.(?:env|bak|old|orig|log|sql|sqlite|sh|py|map|conf|php[0-9]?|phtml|phps)(?:/|$) { return 404; }
location ^~ /lab/ { return 404; }
location = /api { return 404; }
location ^~ /api/ {
  client_max_body_size 16k;
  try_files "" =404;
  location ~ ^/api/(?<hl_endpoint>contact|csrf|ctf|intel|market|shell-auth|shell-slot|thumb|traffic)(?:\.php|/index\.php|/)?$ {
    try_files /api/$hl_endpoint.php =404;
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/api/$hl_endpoint.php;
    fastcgi_param SCRIPT_NAME /api/$hl_endpoint.php;
    fastcgi_param HTTP_COOKIE $http_cookie;
  }
}
