# Included once by nginx-site.conf, alongside nginx-path-server.conf.
# Keep this allowlist and the POST allowlist in nginx-path-http.conf aligned
# when adding a future API. Private helpers are never public PHP entry points.
location = /js/shell/image/resolv.conf { try_files $uri =404; }
location ~ (?:^|/)\. { return 404; }
location ~* (?:^|/)(?:(?:deploy|tests|vendor|node_modules)(?:/|$)|README(?:-OWNER)?\.(?:md|txt)$|OWNER\.txt$) { return 404; }
location ~* "(?:~$|\.(?:env|bak|backup|old|orig|save|sw[op]|log|sql|sqlite[0-9]?|db|ini|yml|yaml|toml|sh|py|map|conf|pem|key|crt|p12|pfx|php[0-9]?|phtml|phar|phps|cgi|pl|asp|aspx|jsp)(?:[/.;]|$))" { return 404; }
location ^~ /lab/ { return 404; }
location = /api { return 404; }
location ^~ /api/ {
  client_max_body_size 16k;
  try_files "" =404;
  location ~ ^/api/(?<hl_endpoint>contact|csrf|ctf|client-ip|intel|market|shell-auth|shell-slot|thumb|traffic)(?:\.php|/index\.php|/)?$ {
    # Empty keys exempt all other APIs, including frequent shell heartbeats.
    # Aliases share one bucket; these supplement the PHP and Cloudflare gates.
    limit_req zone=hl_api_ingress burst=60 nodelay;
    limit_req zone=hl_contact_ingress burst=4 nodelay;
    limit_req zone=hl_auth_ingress burst=4 nodelay;
    limit_req_status 429;
    limit_conn hl_api_active 20;
    limit_conn_status 429;
    try_files /api/$hl_endpoint.php =404;
    include /var/www/highlion/deploy/nginx-fastcgi.conf;
    fastcgi_pass highlion_php;
    fastcgi_pass_request_headers off;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param HTTP_HOST $host;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_REFERER $http_referer;
    fastcgi_param HTTP_X_CSRF_TOKEN $http_x_csrf_token;
    fastcgi_cache off;
    fastcgi_intercept_errors on;
    fastcgi_next_upstream off;
    fastcgi_connect_timeout 3s;
    fastcgi_send_timeout 15s;
    fastcgi_read_timeout 30s;
    fastcgi_hide_header X-Powered-By;
    fastcgi_param SCRIPT_FILENAME $document_root/api/$hl_endpoint.php;
    fastcgi_param SCRIPT_NAME /api/$hl_endpoint.php;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param HTTP_PROXY "";
  }
}
