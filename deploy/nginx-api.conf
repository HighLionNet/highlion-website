autoindex off;
location ~* ^/(?:\.|deploy(?:/|$)|README(?:-OWNER)?\.(?:md|txt)$|js/shell/README-OWNER\.txt$|assets/fonts/.*\.sh$) { return 404; }
location ~* \.(?:env|bak|old|orig|log|sql|sqlite|sh|py|map|conf)$ { return 404; }
location ^~ /lab/ { return 404; }
location ^~ /api/ {
  client_max_body_size 16k;
  location ~ ^/api/_ { return 404; }
  try_files $uri $uri/ $uri.php =404;
  location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_COOKIE $http_cookie;
  }
}
