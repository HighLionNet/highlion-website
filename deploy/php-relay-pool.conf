; Install in /etc/php/<active-version>/fpm/pool.d/highlion-relay.conf.
; Separate from the site's application pool. PHP >= 7.3 (site requires 8+).
[highlion-relay]
user = www-data
group = www-data
listen = /run/php/highlion-relay.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 100
request_terminate_timeout = 5s
request_terminate_timeout_track_finished = yes
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[file_uploads] = off
php_admin_flag[allow_url_include] = off
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_value[memory_limit] = 32M
php_admin_value[default_socket_timeout] = 2
php_admin_value[open_basedir] = /var/www/highlion/api:/etc/highlion/honeypot.env:/var/lib/highlion/abuse:/var/tmp:/etc/ssl/certs:/usr/share/zoneinfo
