# Include once in the site's server{} block (requires nginx auth_request module).
# Shared FastCGI parameters use the same canonical identity as the public API.
# Never independently trust HTTP forwarding headers inside PHP.
auth_request /_hl-ban-check;
location = /_hl-ban-check {
  internal;
  auth_request off;
  include /var/www/highlion/deploy/nginx-fastcgi.conf;
  fastcgi_pass highlion_php;
  fastcgi_pass_request_headers off;
  fastcgi_pass_request_body off;
  fastcgi_param CONTENT_LENGTH "";
  fastcgi_param SCRIPT_FILENAME $document_root/api/ban-check.php;
  fastcgi_param SCRIPT_NAME /api/ban-check.php;
}
