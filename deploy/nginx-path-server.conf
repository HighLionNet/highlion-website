# Include ONCE inside the existing HTTPS server for highlion.net, after root
# and BEFORE any server-level rewrite/return. Keep its TLS, location /,
# existing 403/404/405 error_page directives and nginx-headers.conf.
# Include nginx-api.conf separately as before; do NOT include the legacy
# nginx-shell-slot.conf. Remove both suggested trap rewrite "if" blocks.
# Do not add a broad PHP handler or a ^~ static prefix above these guards.
server_tokens off;
autoindex off;
merge_slashes on;
client_max_body_size 16k;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 30s;
max_ranges 1;
# Keep normal access_log lines in THIS server: defining this additional log
# overrides inheritance from http. This log contains probes only.
# If there is no server-level access_log yet, add:
# access_log /var/log/nginx/access.log;
access_log /var/log/nginx/highlion-path.log hl_path if=$hl_security_event;

# Trust CF-Connecting-IP only from actual Cloudflare socket peers.
# For this site's Cloudflare Tunnel, ALSO include nginx-cloudflared-server.conf
# in its LOOPBACK-ONLY origin server. Do not add loopback trust to a public listener.
# Replace any existing real_ip_header/set_real_ip_from in this server with
# this block. Never retain a broad 0.0.0.0/0 or ::/0 trust entry.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# All "if" directives only return; there are no rewrite loops.
error_page 418 = @hl_station;
if ($hl_reject_encoding) { return 403; }
if ($hl_dispatch) { return 418; }
if ($hl_reject_private) { return 404; }
if ($hl_reject_scanner) { return 404; }
if ($hl_method_denied) { return 405; }
# Tighten the existing IL contact-page lock against forged CF-IPCountry.
# This does not gate /api/contact or the existing form on /403.html.
if ($hl_contact_denied) { return 403; }

location @hl_station {
    # Named locations have no public URL. Preserve ORIGINAL URI and method.
    internal;
    limit_req zone=hl_relay_ip;
    limit_req zone=hl_relay_total burst=1 nodelay;
    limit_req_status 403;
    limit_conn hl_relay_active 2;
    limit_conn_status 403;
    error_page 403 500 502 503 504 =403 /403.html;
    fastcgi_pass unix:/run/php/highlion-relay.sock;
    fastcgi_connect_timeout 1s;
    fastcgi_send_timeout 2s;
    fastcgi_read_timeout 4s;
    fastcgi_next_upstream off;
    fastcgi_cache off;
    fastcgi_intercept_errors off;
    fastcgi_pass_request_body off;
    fastcgi_pass_request_headers off;
    # Deliberately no include fastcgi_params here: no duplicate CGI fields,
    # cookies, authorization, content length or request body reach this pool.
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param REDIRECT_STATUS 200;
    fastcgi_param SCRIPT_FILENAME /var/www/highlion/api/_relay.php;
    fastcgi_param SCRIPT_NAME /api/_relay.php;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param HL_CLIENT_IP $remote_addr;
    fastcgi_param HL_PEER_IP $realip_remote_addr;
    fastcgi_param HTTP_USER_AGENT $http_user_agent;
    fastcgi_param HTTP_CF_IPCOUNTRY $hl_verified_country;
    fastcgi_param HL_ROUTE station;
    fastcgi_param HL_REASON $hl_probe_reason;
    fastcgi_param HL_REQUEST_ID $request_id;
}
