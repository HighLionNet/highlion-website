user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    map_hash_bucket_size 128;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # One set of maps/zones; do not install a second copy in conf.d.
    include /var/www/highlion/deploy/nginx-path-http.conf;
    upstream highlion_php {
        server unix:/run/php/php8.2-fpm.sock;
    }

    # Canonical address, not the raw visitor-supplied forwarding header.
    log_format cloudflare '$hl_client_ip - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'country="$hl_verified_country" peer="$realip_remote_addr" '
                          'source="$hl_ip_source" id="$request_id"';
    access_log /var/log/nginx/access.log cloudflare;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;
    keepalive_timeout 30s;
    reset_timedout_connection on;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
