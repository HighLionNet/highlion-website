# Unknown Host values never select the site or an application PHP route.
server {
    listen 127.0.0.1:80 default_server;
    listen 127.0.0.1:8081 default_server;
    server_name _;
    set $hl_transport socket;
    set_real_ip_from unix:;
    return 421;
}

# cloudflared must connect to this loopback listener, with the original Host.
server {
    listen 127.0.0.1:80;
    server_name www.highlion.net;
    set $hl_transport cloudflared;
    include /var/www/highlion/deploy/nginx-cloudflared-server.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    include /var/www/highlion/deploy/nginx-site.conf;
}

# Keep the onion service isolated from trusted Cloudflare headers.
# Its existing HiddenServicePort 80 target must be 127.0.0.1:8081.
server {
    listen 127.0.0.1:8081;
    server_name hh7547je3hpb4hj7stuiorzwnwazamecatqn6saqkxamlmckztgr2lid.onion;
    set $hl_transport tor;
    # Override inherited trust: this TCP listener trusts no IP peer's headers.
    set_real_ip_from unix:;
    real_ip_header X-HighLion-Unused;
    real_ip_recursive off;
    include /var/www/highlion/deploy/nginx-site.conf;
}

server {
    listen 127.0.0.1:80;
    server_name highlion.net;
    set $hl_transport cloudflared;
    return 308 https://www.highlion.net$request_uri;
}
