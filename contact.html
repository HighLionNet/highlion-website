<!doctype html>
<html lang="en">
<head>
  <meta name="application-name" content="HighLion HLv8">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070914">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta name="description" content="Contact HighLion and find its public security profiles.">
  <title>HighLion — Contact</title>
  <link rel="icon" href="/assets/icons/HighLion.ico?v=hl90" sizes="any">
  <link rel="stylesheet" href="/css/style.css?v=hl91">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="scanlines" aria-hidden="true"></div>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  <div data-include="/components/header.html?v=hl90"></div>

  <main id="main">
    <header class="shell page-head compact">
      <div class="page-head-row">
        <h2>Contact Me:</h2>
      </div>
    </header>

    <section class="shell contact-layout" aria-label="Contact form and public links">
      <form class="contact-panel contact-form monitor" id="contactForm" novalidate>
        <div class="contact-panel-head">
          <h2>Leave a Message</h2>
        </div>
        <div class="field">
          <label for="name">Your Name</label>
          <input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required>
          <span class="field-error" id="nameError"></span>
        </div>
        <div class="field">
          <label for="email">Your Email</label>
          <input id="email" name="email" type="email" autocomplete="email" minlength="6" maxlength="254" required>
          <span class="field-error" id="emailError"></span>
        </div>
        <div class="field">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" minlength="10" maxlength="4000" required></textarea>
          <span class="field-error" id="messageError"></span>
        </div>
        <div class="honeypot spare" aria-hidden="true">

          <label for="company">Company</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <div class="form-row">
          <button class="btn" id="submitContact" type="submit">Send Message</button>
          <span class="form-status" id="formStatus" data-state="" aria-live="polite"></span>
        </div>
        <p class="contact-copy" id="formFeedback" aria-live="polite"></p>
      </form>

      <aside class="contact-panel contact-links-panel">
        <div class="contact-panel-head">
          <h2>Find me Elsewhere</h2>
        </div>
        <div class="socials">
          <a class="social-link" href="https://github.com/HighLionNet" target="_blank" rel="noopener noreferrer">
            <img src="/assets/marks/github.svg?v=hl90" alt="">
            GitHub
          </a>
          <a class="social-link" href="https://www.linkedin.com/in/shmuel-yermus" target="_blank" rel="noopener noreferrer">
            <img src="/assets/marks/linkedin.svg?v=hl90" alt="">
            LinkedIn
          </a>
          <a class="social-link" href="https://www.tryhackme.com/p/tortman25" target="_blank" rel="noopener noreferrer">
            <img src="/assets/marks/tryhackme.svg?v=hl90" alt="">
            TryHackMe
          </a>
          <a class="social-link" href="/cdn-cgi/l/email-protection#f8999c959196b890919f9094919796d6969d8c">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
            <span class="__cf_email__" data-cfemail="85e4e1e8ecebc5edece2ede9eceaebabebe0f1">[email&#160;protected]</span>
          </a>
          <a class="social-link" href="/cdn-cgi/l/email-protection#09686d6460674961606e616560666727676c7d367a7c6b636c6a7d345b6c7a7c646c2c3b397b6c787c6c7a7d" title="Resume is not published. Email to request a copy.">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 2.75h8l4 4V21.25H6z"></path><path d="M14 2.75v4h4M9 12h6M9 16h6"></path></svg>
            Resume available upon request
          </a>
        </div>
      </aside>
    </section>
  </main>

  <div data-include="/components/footer.html?v=hl90"></div>
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="/js/fix-include.js?v=hl90" defer></script>
  <script src="/js/flags.js?v=hl90" defer></script>
  <script src="/js/hlctf.js?v=hl90" defer></script>
  <script src="/js/session-meta.js?v=hl90" defer></script>
  <script src="/js/particles.js?v=hl90" defer></script>
  <script src="/js/station-toggles.js?v=hl90" defer></script>
  <script src="/js/contact-form.js?v=hl90" defer></script>
</body>
</html>
