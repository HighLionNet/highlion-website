<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070914">
  <meta name="description" content="Contact HighLion and find its public security profiles.">
  <title>HighLion — Contact</title>
  <link rel="icon" href="/assets/icons/HighLion.ico" sizes="any">
  <link rel="stylesheet" href="/css/style.css?v=hl8c">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  <div data-include="/components/header.html?v=hl8c"></div>

  <main id="main">
    <header class="shell page-head">
      <div class="kicker">Contact</div>
      <h1 class="headline">Get in touch</h1>
      <p class="lead">Get in touch! Send me a message, request info or just say hello!</p>
    </header>

    <section class="shell contact-layout" aria-label="Contact form and public links">
      <form class="contact-panel contact-form" id="contactForm" novalidate>
        <div class="contact-panel-head">
          <div class="profile-label">Message</div>
          <h2>Send a message</h2>
        </div>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Your Name Here" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="abc123@gmail.com" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" maxlength="4000" placeholder="Hello from the neon district…" required></textarea>
        </div>
        <div class="form-row">
          <button class="btn" id="submitContact" type="submit">Send message</button>
          <span class="form-status" id="formStatus" data-state="idle" aria-live="polite">Idle</span>
        </div>
        <p class="contact-copy" id="formFeedback" aria-live="polite"></p>
      </form>

      <aside class="contact-panel contact-links-panel">
        <div class="contact-panel-head">
          <div class="profile-label">Links</div>
          <h2>Find HighLion</h2>
        </div>
        <div class="socials">
          <a class="social-link" href="https://github.com/highlionnet" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2c-3.22.7-3.9-1.36-3.9-1.36-.52-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.3-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.03 0 0 .96-.31 3.16 1.17a10.9 10.9 0 0 1 5.76 0c2.2-1.48 3.16-1.17 3.16-1.17.62 1.57.23 2.74.11 3.03.74.8 1.18 1.82 1.18 3.08 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.14v3.18c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"></path></svg>
            GitHub
          </a>
          <a class="social-link" href="https://www.linkedin.com/in/shmuel-yermus" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.7 3.1A2.4 2.4 0 1 1 0 3.1a2.4 2.4 0 0 1 4.7 0ZM.4 7.6h4.2V21H.4V7.6Zm6.8 0h4v1.8h.06c.56-1.06 1.92-2.18 3.95-2.18 4.23 0 5.01 2.78 5.01 6.4V21h-4.18v-6.54c0-1.56-.03-3.57-2.18-3.57-2.18 0-2.51 1.7-2.51 3.46V21H7.2V7.6Z"></path></svg>
            LinkedIn
          </a>
          <a class="social-link" href="https://www.tryhackme.com/p/tortman25" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2 4 5.5v5.2c0 5 3.3 9.3 8 11.3 4.7-2 8-6.3 8-11.3V5.5L12 2Z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg>
            TryHackMe
          </a>
        </div>
        <p class="contact-copy"><a class="social-link" href="mailto:admin@highlion.net">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
          admin@highlion.net
        </a></p>
      </aside>
    </section>
  </main>

  <div data-include="/components/footer.html?v=hl8c"></div>
  <script src="/js/fix-include.js?v=hl8c" defer></script>
  <script src="/js/particles.js?v=hl8c" defer></script>
  <script>
    (function () {
      var form = document.getElementById("contactForm");
      var button = document.getElementById("submitContact");
      var status = document.getElementById("formStatus");
      var feedback = document.getElementById("formFeedback");
      var fields = {
        name: document.getElementById("name"),
        email: document.getElementById("email"),
        message: document.getElementById("message")
      };

      function setState(state, detail) {
        status.textContent = state;
        status.dataset.state = state.toLowerCase();
        feedback.textContent = detail || "";
      }

      function valid(payload) {
        var emailShape = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        var checks = {
          name: payload.name.length >= 2 && payload.name.length <= 80,
          email: payload.email.length <= 254 && emailShape.test(payload.email),
          message: payload.message.length >= 10 && payload.message.length <= 4000
        };
        Object.keys(checks).forEach(function (key) {
          fields[key].setAttribute("aria-invalid", checks[key] ? "false" : "true");
        });
        return checks.name && checks.email && checks.message;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        var payload = {
          name: fields.name.value.trim(),
          email: fields.email.value.trim(),
          message: fields.message.value.trim()
        };

        if (!valid(payload)) {
          setState("Error", "Check the highlighted fields.");
          return;
        }

        setState("Sending", "");
        button.disabled = true;
        try {
          var response = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error("Request failed");
          form.reset();
          setState("Sent", "Message sent.");
        } catch (error) {
          setState("Error", "Message not sent.");
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
